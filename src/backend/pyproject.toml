[project]
name = "ai-adoption-tracker-backend"
version = "0.1.0"
description = "Backend for the AI Adoption Tracker — an offline, air-gapped tool to track week-by-week Claude Code adoption per team."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.99",
    "anthropic>=0.40",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: modules live directly under src/backend/ (this dir).
py-modules = ["app", "db", "models"]
